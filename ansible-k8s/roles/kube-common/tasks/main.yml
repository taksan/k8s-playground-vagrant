# swap is disabled because kubelet doesn't support it
- name: Ensure root .ssh directory exists
  become: true
  file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Authorize playground SSH key for root user
  become: true
  authorized_key:
    user: root
    state: present
    key: "{{ lookup('file', playbook_dir + '/../ssh/id_ed25519_playground.pub') }}"

- name: Disables swap removing from /etc/fstab
  mount:
    name: "{{ item }}"
    fstype: swap
    state: absent
  with_items:
    - swap
    - none
  become: true

- name: Disables swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0
  become: true

- name: Update apt
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: true

- name: Create contained.conf
  template:
    src: templates/containerd.conf.j2
    dest: /etc/modules-load.d/containerd.conf
  become: true

- name: Load kernel modules
  command: modprobe {{ item }}
  become: true
  changed_when: false
  loop:
    - overlay
    - br_netfilter

- name: Create kubernetes-cri.conf
  template:
    src: templates/kubernetes-cri.conf.j2
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
  become: true

- name: Create kernel config
  template:
    src: templates/k8s.conf.j2
    dest: /etc/modules-load.d/k8s.conf
  become: true

- name: Apply sysctl settings
  shell: sysctl --system
  become: true

- name: Install packages to setup the apt repos
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
      - git
    state: present
  become: true

# Setup k8s repo
- name: Check if k8s gpg key file exists
  stat:
    path: /etc/apt/keyrings/kubernetes-{{kube_version}}-apt-keyring.gpg
  register: gpg_key_file

- name: Setup kubernetes repo
  shell: |
    set -e
    # make sure to remove older gpg key file and apt list file
    rm -f /etc/apt/keyrings/kubernetes-*.gpg
    rm -f /etc/apt/sources.list.d/kubernetes*.list

    # install new gpg key file and apt list file
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{kube_version}}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-{{kube_version}}-apt-keyring.gpg
    echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-{{kube_version}}-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{kube_version}}/deb/ /' > /etc/apt/sources.list.d/kubernetes-{{kube_version}}.list
  become: true
  when: gpg_key_file.stat.exists == false

# Setup gVisor repo
- name: Check if gvisor gpg key file exists
  stat:
    path: /etc/apt/keyrings/gvisor-archive-keyring.gpg
  register: gpg_gvisor_key_file

- name: Setup gvisor repo
  shell: |
    set -e

    # make sure to remove older gpg key file and apt list file
    rm -f /etc/apt/keyrings/gvisor-archive-keyring.gpg
    rm -f /etc/apt/sources.list.d/gvisor.list

    # install new gpg key file and apt list file
    curl -fsSL https://gvisor.dev/archive.key | gpg --dearmor -o /etc/apt/keyrings/gvisor-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" > /etc/apt/sources.list.d/gvisor.list
  become: true
  when: gpg_gvisor_key_file.stat.exists == false

# Setup Falco repo
- name: Check if falco apt key exists
  stat:
    path: /etc/apt/keyrings/falco-archive-keyring.gpg
  register: falco_key_file

- name: Setup falco repo
  shell: |
    set -e
    curl -fsSL https://falco.org/repo/falcosecurity-packages.asc | gpg --dearmor -o /etc/apt/keyrings/falco-archive-keyring.gpg
    echo "deb [signed-by=/etc/apt/keyrings/falco-archive-keyring.gpg] https://download.falco.org/packages/deb stable main" > /etc/apt/sources.list.d/falcosecurity.list
  become: true
  when: falco_key_file.stat.exists == false

# Single apt update + single apt transaction for everything (containerd, kubernetes, gVisor, Falco).
# Falco's package setup reads these variables so it does not prompt for a driver.
- name: Install containerd, kubernetes, gVisor and Falco packages
  apt:
    name:
      - containerd
      - "kubelet={{ kube_version }}.0-1.1"
      - "kubeadm={{ kube_version }}.0-1.1"
      - "kubectl={{ kube_version }}.0-1.1"
      - "cri-tools={{ kube_version }}.0-1.1"
      - runsc
      - falco
    state: present
    update_cache: "{{ gpg_key_file.stat.exists == false or gpg_gvisor_key_file.stat.exists == false or falco_key_file.stat.exists == false }}"
  environment:
    FALCO_FRONTEND: noninteractive
    FALCO_DRIVER_CHOICE: modern_ebpf
  become: true

- name: Hold kubernetes packages
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  become: true
  loop:
    - kubelet
    - kubeadm
    - kubectl
    - cri-tools

# Generate the default containerd config only once so re-provisioning does not
# rewrite it and restart containerd every time.
- name: Create containerd config
  shell: |
    mkdir -p /etc/containerd
    if ! grep -q SystemdCgroup /etc/containerd/config.toml 2>/dev/null; then
      containerd config default > /etc/containerd/config.toml
      echo generated
    fi
  register: containerd_config
  changed_when: "'generated' in containerd_config.stdout"
  become: true
  notify: restart containerd

- name: Use systemd cgroup driver in containerd
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  become: true
  notify: restart containerd

# Register gVisor (runsc) as a containerd runtime. The CRI plugin id differs between
# containerd 1.x (io.containerd.grpc.v1.cri) and 2.x (io.containerd.cri.v1.runtime).
- name: Register runsc runtime in containerd config
  shell: |
    set -e
    CFG=/etc/containerd/config.toml
    if grep -q "runtimes.runsc" "$CFG"; then exit 0; fi
    if grep -q "io.containerd.cri.v1.runtime" "$CFG"; then
      PLUGIN="io.containerd.cri.v1.runtime"
    else
      PLUGIN="io.containerd.grpc.v1.cri"
    fi
    cat >> "$CFG" <<EOT

    [plugins.'${PLUGIN}'.containerd.runtimes.runsc]
      runtime_type = 'io.containerd.runsc.v1'
    EOT
    echo added
  args:
    executable: /bin/bash
  register: runsc_runtime
  changed_when: "'added' in runsc_runtime.stdout"
  become: true
  notify: restart containerd

- name: Set kubelet node IP
  copy:
    dest: /etc/default/kubelet
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: restart kubelet

# Falco as a regular systemd service on every VM (modern eBPF driver, no kernel module)
- name: Disable unused falco driver services
  systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  become: true
  ignore_errors: true
  loop:
    - falco-bpf
    - falco-kmod
    - falco

- name: Enable and start falco (modern eBPF)
  systemd_service:
    name: falco-modern-bpf
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Check if yq exists
  shell: command -v yq
  become: true
  register: yq_exists
  changed_when: false
  failed_when: false

- name: Install yq
  shell: |
    set -e
    YQ_VERSION=v4.47.1
    ARCH=$(dpkg --print-architecture)
    curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${ARCH}
    chmod 0755 /usr/local/bin/yq
  args:
    executable: /bin/bash
  become: true
  when: yq_exists.rc != 0
