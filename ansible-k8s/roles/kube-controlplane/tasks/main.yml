- name: Check if cluster is initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_admin_conf

- name: Initialize cluster if needed
  shell: |
    kubeadm init --pod-network-cidr=192.90.0.0/16 --kubernetes-version={{ kube_version }}.0 --ignore-preflight-errors=NumCPU --apiserver-advertise-address={{ node_ip }}
  become: true
  when: k8s_admin_conf.stat.exists == false

- name: Copy kube config
  shell: |
    mkdir -p $HOME/.kube
    cp -f /etc/kubernetes/admin.conf $HOME/.kube/config
  become: true

- name: Export admin.conf to control node working directory
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../vagrant-kubeconfig"
    flat: true
  become: true
  run_once: true

- name: Update exported admin.conf server to use controlplane IP
  lineinfile:
    path: "{{ playbook_dir }}/../vagrant-kubeconfig"
    regexp: '^\s*server:\s*https://.*'
    line: "    server: https://{{ node_ip }}:6443"
  delegate_to: localhost
  run_once: true

- name: Check if cilium already exists
  shell: |
    cilium version
  become: true
  register: cilium_exists
  ignore_errors: true

- name: Download Cilium CLI
  shell: |
    set -e
    
    CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
    CLI_ARCH=amd64
    if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
    curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
    sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
    tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
    rm -f cilium-linux-${CLI_ARCH}.tar.gz*
  become: true
  when: cilium_exists.rc != 0

- name: Install Cilium CNI
  shell: |
    cilium install --version 1.18.4
  become: true
  when: cilium_exists.rc != 0
