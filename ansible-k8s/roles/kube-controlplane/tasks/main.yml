- name: Check if cluster is initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_admin_conf

- name: Initialize cluster if needed
  shell: |
    kubeadm init --pod-network-cidr=192.90.0.0/16 --kubernetes-version={{ kube_version }}.0 --ignore-preflight-errors=NumCPU --apiserver-advertise-address={{ node_ip }}
  become: true
  when: k8s_admin_conf.stat.exists == false

- name: Copy kube config
  shell: |
    mkdir -p $HOME/.kube
    cp -f /etc/kubernetes/admin.conf $HOME/.kube/config
  become: true

- name: Export admin.conf to control node working directory
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../vagrant-kubeconfig"
    flat: true
  become: true
  run_once: true

- name: Update exported admin.conf server to use k8s-api-server IP
  lineinfile:
    path: "{{ playbook_dir }}/../vagrant-kubeconfig"
    regexp: '^\s*server:\s*https://.*'
    line: "    server: https://{{ node_ip }}:6443"
  delegate_to: localhost
  run_once: true

- name: Check if Cilium CLI exists
  shell: |
    command -v cilium
  become: true
  register: cilium_cli_exists
  changed_when: false
  failed_when: false

- name: Download Cilium CLI
  shell: |
    set -e
    
    CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
    CLI_ARCH=amd64
    if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
    curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
    sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
    tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
    rm -f cilium-linux-${CLI_ARCH}.tar.gz*
  become: true
  when: cilium_cli_exists.rc != 0

- name: Check if Cilium is installed in the cluster
  shell: |
    kubectl -n kube-system get daemonset cilium
  become: true
  register: cilium_installed
  changed_when: false
  failed_when: false

# Every Vagrant VM has the same NAT address on eth0 (10.0.2.15), so Cilium must be
# pinned to the host-only interface (eth1), otherwise the VXLAN tunnels between
# nodes point at the same IP and cross-node pod traffic (e.g. admission webhooks) breaks.
- name: Install Cilium CNI
  shell: |
    cilium install --version 1.18.4 \
      --set devices=eth1 \
      --set ipam.operator.clusterPoolIPv4PodCIDRList=192.90.0.0/16
  become: true
  when: cilium_installed.rc != 0

- name: Wait for Cilium to be ready
  shell: |
    cilium status --wait --wait-duration 10m
  become: true
  changed_when: false

- name: Install MetalLB
  shell: |
    kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.16.1/config/manifests/metallb-frr-k8s.yaml
  become: true

- name: Wait for MetalLB controller to be ready
  shell: |
    kubectl -n metallb-system rollout status deployment/controller --timeout=300s
  become: true
  changed_when: false

# The validating webhook may not answer right after the controller becomes ready
- name: Configure MetalLB address pool
  shell: |
    kubectl apply -f -
  args:
    stdin: "{{ lookup('file', playbook_dir + '/../metallb.yml') }}"
  become: true
  register: metallb_config
  until: metallb_config is succeeded
  retries: 10
  delay: 15
